<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f4a33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pub Golf">
<title>Cape Town Pub Golf</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{color-scheme:light dark;
--bg:light-dark(#eef2ec,#0a1510);--card:light-dark(#ffffff,#13241c);--ink:light-dark(#0f1f17,#e9f1ec);
--mute:light-dark(#5b6b62,#9db3a7);--green:light-dark(#0f4a33,#0d3524);--line:light-dark(#d9e2db,#25392e);
--soft:light-dark(#e5efe8,#1a3326);--red:#e2412f;--gold:light-dark(#9a6b00,#f2c14e);--ok:light-dark(#1f8a4c,#5fd08f);
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
ol,ul{list-style:none;margin:0;padding:0}
.top{position:sticky;top:0;z-index:20;background:var(--green);color:#f3f8f4;padding:calc(var(--st) + 12px) 16px 12px}
.top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.top h1{font-size:20px;margin:0;line-height:1.15;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top small{display:block;font-size:13px;font-weight:400;color:#bcd6c6}
.ib{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;font-weight:600;cursor:pointer;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:14px 12px calc(96px + var(--sb))}
main.full{padding-bottom:24px}
h2{font-size:22px;margin:22px 0 10px;font-weight:800;line-height:1.15}
h2:first-child{margin-top:4px}
.hero{background:var(--green);color:#f3f8f4;border-radius:20px;padding:22px 18px;margin-bottom:14px}
.hero h1{font-size:32px;line-height:1.05;margin:0 0 6px}
.hero p{margin:0;color:#bcd6c6}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;border-radius:12px;border:0;background:var(--green);color:#fff;font-weight:600;text-decoration:none;cursor:pointer;padding:0 14px;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
form{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
form input{flex:1 1 160px;font-size:16px;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px}
.note{margin:6px 0 0;font-size:14px;color:var(--mute)}
.warn{margin:8px 0 0;font-size:14px;color:var(--red);font-weight:600}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:0;border-radius:999px;padding:6px 14px;font-weight:600;min-height:40px;cursor:pointer}
.chip.x{padding-right:4px;cursor:default}
.chip.x button{width:34px;height:34px;border:0;border-radius:50%;background:transparent;font-size:18px;color:var(--mute);cursor:pointer}
.av{flex:none;width:34px;height:34px;border-radius:50%;object-fit:cover;display:inline-grid;place-items:center;font-weight:800;font-size:13px;color:#fff}
.av.s{width:26px;height:26px;font-size:11px}
/* progress */
.prog{background:var(--green);color:#f3f8f4;border-radius:16px;padding:14px 16px;margin-bottom:12px}
.prog b{display:block;font-size:22px;line-height:1.15}
.prog span{font-size:14px;color:#bcd6c6}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--red);border-radius:8px;transition:width .3s}
.flags{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.flags a{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;text-decoration:none;color:#fff;border:2px solid rgba(255,255,255,.6)}
.flags a.d{background:#f3f8f4;color:var(--green);border-color:#f3f8f4}.flags a.c{background:var(--red);border-color:#fff}
/* holes */
.hole{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;scroll-margin-top:calc(var(--st) + 80px)}
.hole.now{border:2px solid var(--red);box-shadow:0 6px 22px -12px rgba(226,65,47,.6)}
.hole.done{background:var(--soft)}
.hd{display:flex;gap:12px;align-items:flex-start}
.num{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--green);color:#fff;font-size:17px}
.now .num{background:var(--red)}.done .num{background:transparent;color:var(--ok);border:2px solid var(--ok)}
.tt{flex:1}
h3{margin:0;font-size:19px;line-height:1.2}
.addr{margin:2px 0 0;color:var(--mute);font-size:14px}
.par{flex:none;font-size:13px;color:var(--mute);text-align:center;line-height:1.1}
.par b{display:block;font-size:24px;color:var(--ink)}
.drink{margin:10px 0 0;font-weight:600;font-size:17px}
.drink span{font-weight:400;color:var(--mute);font-size:13px;margin-right:6px}
.herenow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:14px;color:var(--mute)}
.seg{display:flex;gap:6px;margin-top:10px}
.seg button{flex:1;min-height:42px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--green);color:#fff;border-color:var(--green)}
.sc{margin-top:12px;border-top:1px solid var(--line)}
.sc li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);min-height:57px}
.pn{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:22px;font-weight:600;cursor:pointer;touch-action:manipulation}
output{width:40px;text-align:center;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
output.nil{color:var(--mute);font-weight:400}output.under{color:var(--ok)}output.over{color:var(--red)}
.act{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.act .wide{grid-column:1/-1}
.special{margin:8px 0 0;font-size:14px;font-weight:600;color:var(--gold)}
.pn small.pen{display:block;font-size:12px;font-weight:600;color:var(--red);white-space:normal}
.sc-t{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.sc-t th,.sc-t td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:center}
.sc-t th{font-size:12px;color:var(--mute);font-weight:600;overflow:hidden;text-overflow:ellipsis;max-width:56px;white-space:nowrap}
.sc-t td:first-child,.sc-t th:first-child{text-align:left}
.sc-t tfoot td{font-weight:800;border-bottom:0}
.sc-t .u{color:var(--ok);font-weight:700}.sc-t .o{color:var(--red);font-weight:700}
.scroll{overflow-x:auto}
.rules h3{margin:18px 0 6px}.rules h3:first-child{margin-top:0}
.rules ul{list-style:disc;padding-left:20px}.rules li{margin:4px 0}
.pt{width:100%;border-collapse:collapse;font-size:15px}.pt td{padding:8px 0;border-bottom:1px solid var(--line)}.pt td:last-child{text-align:right;font-weight:800;white-space:nowrap}
.penlist{display:grid;gap:8px;margin-top:10px}
.penlist button{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;text-align:left;cursor:pointer}
.penlist button b{color:var(--red);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--green);color:#fff}
.tagline{font-style:italic;color:#bcd6c6;margin-top:4px!important}
/* board */
.lb li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.lb li:last-child{border-bottom:0}
.rk{font-weight:800;color:var(--mute);font-size:18px}.lb li:first-child .rk{color:var(--gold)}
.tn{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
.mem,.where{display:block;font-size:13px;color:var(--mute)}
.vp{font-weight:800;font-size:22px;min-width:56px;text-align:right;font-variant-numeric:tabular-nums;line-height:1.1}
.vp small{display:block;font-size:12px;font-weight:400;color:var(--mute);white-space:nowrap}
.mine{background:var(--soft);border-radius:12px;padding-inline:8px!important;margin-inline:-8px}
/* feed */
.feed li{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.feed li:last-child{border-bottom:0}
.feed p{margin:0;font-size:15px}.feed time{font-size:13px;color:var(--mute);white-space:nowrap}
.feed img.ph{display:block;width:100%;max-height:440px;object-fit:cover;border-radius:12px;margin-top:8px;background:var(--soft)}
/* pubs picker */
.pubgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:12px}
.pubgrid button{position:relative;min-height:62px;border-radius:12px;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06);color:#f3f8f4;font-size:12.5px;font-weight:600;line-height:1.15;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.pubgrid button b{font-size:16px;font-weight:800}
.pubgrid button.d{background:#f3f8f4;color:var(--green);border-color:#f3f8f4}
.pubgrid button.h{background:var(--red);border-color:#fff}
.pubgrid button.sel{outline:3px solid #f2c14e;outline-offset:1px}
.pubgrid .cnt{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#f2c14e;color:#2a2000;font-size:11px;font-weight:800;display:grid;place-items:center}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:#bcd6c6}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* photos */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pgrid button{position:relative;padding:0;border:0;border-radius:14px;overflow:hidden;aspect-ratio:1;background:var(--soft);cursor:pointer}
.pgrid img{width:100%;height:100%;object-fit:cover;display:block}
.pgrid span{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;font-size:12px;font-weight:600;color:#fff;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.7))}
select{font:inherit;font-size:16px;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 10px;flex:1 1 160px}
.viewer{align-items:center;padding:12px;background:rgba(0,0,0,.92)}
.viewer figure{margin:0;max-width:720px;width:100%}
.viewer img{display:block;width:100%;max-height:72vh;object-fit:contain;border-radius:12px}
.viewer figcaption{color:#fff;margin:10px 2px;font-size:15px}
/* live */
#mapWrap{max-width:720px;margin:0 auto;padding:14px 12px 0}
#map{height:44vh;min-height:260px;border-radius:16px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.mapbar{margin-top:8px;font-size:14px;display:flex;gap:10px;align-items:center}
.mapbar span{flex:1;color:var(--mute)}
#mapWrap+main{padding-top:4px}
.pin{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#0f4a33;color:#fff;font:800 13px Archivo,sans-serif;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.tpin{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;color:#fff;font:700 12px Archivo,sans-serif;border:2px solid #fff;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.tpin.left{opacity:.7;border-style:dashed}
.wl li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.wl li:last-child{border-bottom:0}
.wl b{display:block}.wl span{font-size:13px;color:var(--mute)}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--sb)}
nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{min-height:62px;border:0;background:transparent;color:var(--mute);font-weight:600;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button svg{width:24px;height:24px}
nav button[aria-current=true]{color:var(--red)}
/* sheet, dialog, toast */
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 14px calc(18px + var(--sb))}
.dlg{align-items:center;padding:20px}.dlg .card{max-width:360px;width:100%}.dlg p{margin:0 0 14px;font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + var(--sb));z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw;text-align:center}
#net{position:fixed;left:0;right:0;top:0;z-index:90;background:var(--red);color:#fff;text-align:center;font-size:13px;font-weight:600;padding:calc(var(--st) + 4px) 10px 4px}
.row{display:flex;gap:10px;align-items:center}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px}
.sw input{width:24px;height:24px;accent-color:var(--green)}
.empty{color:var(--mute);margin:0;padding:6px 0}
.glist button{width:100%;justify-content:space-between;margin-top:8px}
@media(max-width:380px){.st{width:40px}.pubgrid button{font-size:11.5px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="net" hidden>No connection. Changes are saved as soon as you are back online.</div>
<div id="topbar" hidden></div>
<div id="mapWrap" hidden><div id="map"></div><div class="mapbar" id="mapbar"></div></div>
<main id="view"></main>
<nav id="nav" hidden><div class="in">
  <button data-tab="pubs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 21V3l11 4-11 4"/></svg>Pubs</button>
  <button data-tab="board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>Board</button>
  <button data-tab="photos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg>Photos</button>
  <button data-tab="live"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Live</button>
  <button data-tab="rules"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg>Rules</button>
</div></nav>
<div id="ovl"></div>
<div id="toast" hidden></div>
<input type="file" id="file" accept="image/*" hidden>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
{
const H=[
 {par:3,drink:'Guinness or Hard Ice Tea',short:'Lucky Lou',b:{name:'Lucky Lou',addr:'158 Kloof St, Gardens',lat:-33.9366703,lng:18.4047433,closed:[]}},
 {par:3,drink:'Aperol Sour',short:'Dark Horse',b:{name:'The Dark Horse',addr:'145 Kloof St, Gardens',lat:-33.9343684,lng:18.4073765,closed:[0,1]}},
 {par:3,drink:'Hard Lemonade',short:'Aruba',b:{name:'Aruba',addr:'108 Kloof St, Gardens',lat:-33.9341033,lng:18.4071816,closed:[1]}},
 {par:2,drink:'Brandy Coke',short:'Van Hunks',special:'Water hazard: no toilets allowed at this hole.',b:{name:'Van Hunks',addr:'1 Upper Union St, Gardens',lat:-33.9319701,lng:18.4085938,closed:[]}},
 {par:2,drink:'House wine',short:'Yours Truly / Blondie',note:'Yours Truly and Blondie are right next to each other. Pick one for the whole game.',
  b:{name:'Yours Truly',addr:'73 Kloof St, Gardens',lat:-33.9302078,lng:18.4109002,closed:[]},
  alt:{name:'Blondie',addr:'69 Kloof St, Gardens',lat:-33.9301436,lng:18.411004,closed:[1]}},
 {par:1,drink:'Springbok shot',short:"Tiger's Milk",b:{name:"Tiger's Milk",addr:'55 Kloof St, Gardens',lat:-33.9292781,lng:18.4116503,closed:[]}},
 {par:2,drink:'Corona',short:'Fat Cactus',special:'Dogleg: drink with your weak hand only.',b:{name:'The Fat Cactus',addr:'5 Park Rd, Gardens',lat:-33.9287646,lng:18.4107849,closed:[]}},
 {par:3,drink:'Skinny Bitch',short:'Power & Glory',b:{name:'The Power & The Glory',addr:'13d Kloof Nek Rd, Tamboerskloof',lat:-33.9299367,lng:18.4081287,closed:[]}},
 {par:2,drink:'Savanna',short:'Athletic Social',note:'In the CBD, about 15 to 20 minutes on foot from Kloof Street. An Uber makes sense here.',
  b:{name:'The Athletic Club & Social',addr:'35 Buitengracht St, CBD',lat:-33.9194999,lng:18.4188692,closed:[0]}}
];
const PENS=[['sit','Sitting out a hole',3],['puke','Puking',3],['fall','Falling over',1],['spillown','Spilling your own drink',2],['spillother',"Spilling someone else's drink",1],['dispute','Failed referee dispute',1],['cheat','Cheating',3],['special','Breaking special hole rules',2],['bribe','Bribery attempt',2],['chaos','Ungentlemanly behaviour or general chaos',1]];
const PENMAP=Object.fromEntries(PENS.map(x=>[x[0],x]));
const PAR=H.reduce((a,h)=>a+h.par,0);
const COLORS=['#e2412f','#2f6fe2','#d99a00','#8e44ad','#139a74','#d35400','#c2185b','#34495e','#0097a7','#6d8b00'];
const $=q=>document.querySelector(q);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)});
const tm=t=>{const d=new Date(t);return isNaN(d)?'':d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};
const fmt=v=>v===0?'E':v>0?'+'+v:'−'+Math.abs(v);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const em=e=>(e&&(e.message||e.error_description||e.error||e.code))||'unknown error';
const today=new Date().getDay();
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const CFG=window.BARGOLF_CONFIG||{};
const configured=CFG.url&&CFG.key&&!/YOUR_/.test(CFG.url+CFG.key);
const TABS=['pubs','board','photos','live','rules'];
let sb=null,chan=null,code=null,tab=TABS.includes(ls.get('bg-tab'))?ls.get('bg-tab'):'pubs',needRender=false,sheet=null,selHole=null,recent=null;
const S={game:null,teams:[],players:[],posts:[],loaded:false};

/* ---------- helpers ---------- */
const meId=()=>code?ls.get('bg-me-'+code):null;
const me=()=>S.players.find(p=>p.id===meId())||null;
const myTeam=()=>{const m=me();return m?S.teams.find(t=>t.id===m.team_id)||null:null};
const members=tid=>S.players.filter(p=>p.team_id===tid).sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at)));
const doneOf=t=>(t&&t.done)||{};
const nDone=t=>Object.keys(doneOf(t)).filter(k=>k>=0&&k<9).length;
const locOf=t=>t&&t.here&&+t.here.h>=0&&+t.here.h<9&&!doneOf(t)[+t.here.h]?+t.here.h:null;
const firstOpen=t=>{for(let i=0;i<9;i++)if(!doneOf(t)[i])return i;return 0};
const sel=()=>{if(selHole!=null)return selHole;const t=myTeam(),l=locOf(t);return l!=null?l:firstOpen(t)};
const bar=i=>i===4&&S.game&&S.game.h5==='bl'?H[4].alt:H[i].b;
const col=t=>COLORS[(t&&+t.color||0)%COLORS.length];
const ini=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const av=(p,sm)=>{if(!p)return '';const t=S.teams.find(x=>x.id===p.team_id);
  return p.avatar&&/^https:\/\//.test(p.avatar)?`<img class="av${sm?' s':''}" src="${esc(p.avatar)}" alt="">`:`<span class="av${sm?' s':''}" style="background:${col(t)}" aria-hidden="true">${esc(ini(p.name))}</span>`};
const isPen=o=>typeof o.kind==='string'&&o.kind.startsWith('pen:');
const isPhoto=o=>o.kind==='photo'&&/^https:\/\//.test(o.photo||'');
const pensOf=(pid,i)=>S.posts.filter(o=>isPen(o)&&o.player_id===pid&&(i==null||o.hole===i));
const penSum=(pid,i)=>pensOf(pid,i).reduce((a,o)=>a+(+o.sips||0),0);
const penName=o=>(PENMAP[o.kind.slice(4)]||[0,'Referee call'])[1];
const stats=t=>{const ms=members(t.id);let vp=0,sips=0,n=0,pens=0;ms.forEach(p=>{const s=scoresOf(p);pens+=penSum(p.id);H.forEach((h,i)=>{const v=+s[i];if(v>0){vp+=v-h.par;sips+=v;n++}})});
  return{vp,sips,n,pens,total:sips+pens,diff:vp+pens,holes:nDone(t),size:ms.length}};
const lastDone=t=>{let last=-1,lt=0;const d=doneOf(t);for(let i=0;i<9;i++)if(d[i]&&+d[i]>lt){lt=+d[i];last=i}return{last,lt}};
const status=t=>{const l=locOf(t);if(l!=null)return `At ${bar(l).name} since ${tm(t.here.t)}`;
  const {last,lt}=lastDone(t);if(last<0)return 'Not started yet';if(nDone(t)>=9)return `Finished all 9 at ${tm(lt)}`;
  return `Left ${bar(last).name} at ${tm(lt)}`};

/* ---------- data ---------- */
async function q(p){const r=await p;if(r&&r.error)throw r.error;return r?r.data:null}
// retries a write up to 3 times; fn must build a fresh query each time
async function save(fn,label){let last;for(let k=0;k<3;k++){try{await q(fn());return true}catch(e){last=e;await sleep(1200*(k+1))}}
  console.error(last);toast(`${label||'Not saved'}: ${em(last)}`);sched();return false}
let loading=false;
async function load(){
  if(!code||loading)return;loading=true;
  try{
    const [g,t,p,po]=await Promise.all([q(sb.from('games').select('*').eq('id',code)),q(sb.from('teams').select('*').eq('game_id',code)),q(sb.from('players').select('*').eq('game_id',code)),q(sb.from('posts').select('*').eq('game_id',code))]);
    S.game=(g||[])[0]||null;S.teams=(t||[]).sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at)));S.players=p||[];
    S.posts=(po||[]).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));S.loaded=true;setNet(true);
  }catch(e){console.error(e);if(!S.loaded)toast('No connection to the game: '+em(e));setNet(navigator.onLine)}
  loading=false;render();
}
async function loadRecent(){try{const since=new Date(Date.now()-3*864e5).toISOString();const g=await q(sb.from('games').select('*').gte('created_at',since));
  recent=(g||[]).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at))).slice(0,8)}catch(e){recent=[]}render()}
let lt;const sched=()=>{clearTimeout(lt);lt=setTimeout(load,250)};
function subscribe(){
  if(chan)sb.removeChannel(chan);
  chan=sb.channel('game-'+code);
  ['games','teams','players','posts'].forEach(tb=>chan.on('postgres_changes',{event:'*',schema:'public',table:tb},sched));
  chan.subscribe();
}
function setNet(ok){$('#net').hidden=ok}

/* scores: only the changed holes are merged into the latest server copy, so two phones never overwrite each other */
const dirty={},flushing={},ftimer={};
const scoresOf=p=>{const d=dirty[p.id];if(!d)return p.scores||{};const s={...(p.scores||{})};for(const k in d){if(d[k]==null)delete s[k];else s[k]=d[k]}return s};
function setScore(p,i,v){(dirty[p.id]=dirty[p.id]||{})[i]=v;render();clearTimeout(ftimer[p.id]);ftimer[p.id]=setTimeout(()=>flushScores(p.id),450)}
async function flushScores(pid){
  if(flushing[pid]){clearTimeout(ftimer[pid]);ftimer[pid]=setTimeout(()=>flushScores(pid),400);return}
  const d=dirty[pid];if(!d||!Object.keys(d).length)return;flushing[pid]=true;const sent={...d};
  try{const f=await q(sb.from('players').select('scores').eq('id',pid));const base={...(((f||[])[0]||{}).scores||{})};
    for(const k in sent){if(sent[k]==null)delete base[k];else base[k]=sent[k]}
    await q(sb.from('players').update({scores:base}).eq('id',pid));
    const x=S.players.find(y=>y.id===pid);if(x)x.scores=base;
    for(const k in sent)if(dirty[pid]&&dirty[pid][k]===sent[k])delete dirty[pid][k];
    if(dirty[pid]&&!Object.keys(dirty[pid]).length)delete dirty[pid];setNet(true);
  }catch(e){console.error(e);setNet(false);ftimer[pid]=setTimeout(()=>flushScores(pid),5000)}
  flushing[pid]=false;render();
  if(dirty[pid]&&Object.keys(dirty[pid]).length&&!ftimer[pid])flushScores(pid);
}
const flushAll=()=>Object.keys(dirty).forEach(flushScores);
async function setDone(t,i,on){
  const leave=on&&locOf(t)===i,d={...doneOf(t)};if(on)d[i]=Date.now();else delete d[i];t.done=d;if(leave)t.here=null;render();
  await save(async()=>{const f=await q(sb.from('teams').select('done').eq('id',t.id));const base={...(((f||[])[0]||{}).done||{})};if(on)base[i]=d[i];else delete base[i];
    const upd={done:base};if(leave)upd.here=null;return sb.from('teams').update(upd).eq('id',t.id)},'Hole not saved');
}
function post(o){const row={id:uid(),game_id:code,created_at:new Date().toISOString(),...o};S.posts.unshift(row);render();
  const {created_at,...ins}=row;return save(()=>sb.from('posts').insert(ins),'Not posted')}
async function shrink(file,max){const url=URL.createObjectURL(file);
  try{const img=new Image();img.src=url;await img.decode();const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
    c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',.82))}catch(e){return file}finally{URL.revokeObjectURL(url)}}
async function upload(file,max){const blob=await shrink(file,max),path=`${code}/${uid()}.jpg`;
  const r=await sb.storage.from('photos').upload(path,blob,{contentType:'image/jpeg'});if(r.error)throw r.error;
  return sb.storage.from('photos').getPublicUrl(path).data.publicUrl}

function vTop(){const t=myTeam(),m=me();return `<div class="in"><h1>${esc(S.game?S.game.name:'Pub Golf')}<small>${t?`<span class="dot" style="background:${col(t)};width:9px;height:9px"></span> ${esc(t.name)}, `:''}${esc(m?m.name:'')}</small></h1>
<button class="ib" data-act="invite">Invite</button><button class="ib" data-act="sheet" aria-label="Profile and team">${m?esc(ini(m.name)):'Me'}</button></div>`}
function vSheet(){const m=me(),t=myTeam();if(!m||!t)return '';const ms=members(t.id),sharing=ls.get('bg-loc')==='1';
  return `<div class="ov" data-act="closeov"><div class="sheet" role="dialog" aria-modal="true">
<div class="row">${av(m)}<b style="flex:1">${esc(m.name)}</b><button class="btn ghost" data-act="avatar">Profile photo</button></div>
<form id="fName"><input id="meName" maxlength="20" value="${esc(m.name)}" aria-label="Your name" required><button class="btn">Save name</button></form>
<h2>Your team</h2>
<form id="fTName"><input id="teamName" maxlength="24" value="${esc(t.name)}" aria-label="Team name" required><button class="btn">Rename</button></form>
<div class="chips">${ms.map(p=>`<span class="chip x">${esc(p.name)}${p.id===m.id?' (you)':`<button data-act="rm" data-p="${esc(p.id)}" aria-label="Remove ${esc(p.name)}">×</button>`}</span>`).join('')}</div>
<form id="fMate"><input id="mate" maxlength="20" placeholder="Add a teammate" required><button class="btn ghost">Add</button></form>
<h2>Location</h2>
<label class="sw"><span>Share my live location on the Live map while the app is open</span><input type="checkbox" id="locSw" ${sharing?'checked':''}></label>
<h2>Game</h2><p class="note" style="margin-bottom:10px">Code <b>${esc(code)}</b>. Anyone with the link can join.</p>
<div class="act"><button class="btn ghost" data-act="switch">Switch player</button><button class="btn ghost" data-act="leave">Leave game</button></div>
<div class="act" style="grid-template-columns:1fr"><button class="btn ghost" data-act="closeov">Close</button></div></div></div>`}
let penHole=0,penPid=null;
function vPen(){const i=penHole,b=bar(i),mt=myTeam();
  const order=[...S.teams].sort((a,c)=>(c.id===(mt&&mt.id))-(a.id===(mt&&mt.id)));
  const list=S.posts.filter(o=>isPen(o)&&o.hole===i),pm=Object.fromEntries(S.players.map(p=>[p.id,p]));
  return `<div class="ov" data-act="closeov"><div class="sheet" role="dialog" aria-modal="true"><h2 style="margin-top:0">Penalty at ${esc(b.name)}</h2>
<p class="note">1. Who gets it?</p>${order.map(t=>`<div class="chips">${members(t.id).map(p=>`<button class="chip" data-act="penp" data-p="${esc(p.id)}" aria-pressed="${p.id===penPid}"><span class="dot" style="background:${col(t)}"></span>${esc(p.name)}</button>`).join('')}</div>`).join('')}
<p class="note" style="margin-top:14px">2. What happened?</p><div class="penlist">${PENS.map(x=>`<button data-act="penadd" data-k="${x[0]}" ${penPid?'':'disabled style="opacity:.5"'}><span>${esc(x[1])}</span><b>+${x[2]}</b></button>`).join('')}</div>
${list.length?`<h2>Given at this pub</h2><div class="chips">${list.map(o=>`<span class="chip x">${esc((pm[o.player_id]||{}).name||'Someone')}: ${esc(penName(o))} +${+o.sips}<button data-act="penrm" data-id="${esc(o.id)}" aria-label="Remove penalty">×</button></span>`).join('')}</div>`:''}
<div class="act" style="grid-template-columns:1fr"><button class="btn ghost" data-act="closeov">Done</button></div></div></div>`}
let askFn=null;
function ask(text,fn){$('#ovl').innerHTML=`<div class="ov dlg"><div class="card" role="dialog" aria-modal="true"><p>${esc(text)}</p><div class="act"><button class="btn ghost" data-act="dno">Cancel</button><button class="btn red" data-act="dyes">Yes</button></div></div></div>`;askFn=fn;sheet='ask'}

/* ---------- render ---------- */
function render(){
  const a=document.activeElement;
  if(a&&(a.tagName==='INPUT'||a.tagName==='SELECT')&&(a.closest('#view')||a.closest('#ovl'))){needRender=true;return}
  needRender=false;
  const v=$('#view');let screen;
  if(!configured)screen='setup';else if(!code)screen='start';else if(!me()||!myTeam())screen='who';else screen='main';
  const main=screen==='main';
  $('#topbar').hidden=!main;$('#nav').hidden=!main;v.className=main?'':'full';
  if(main){$('#topbar').className='top';$('#topbar').innerHTML=vTop();document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab))}
  const showMap=main&&tab==='live';$('#mapWrap').hidden=!showMap;
  if(screen==='setup')v.innerHTML=vSetup();else if(screen==='start')v.innerHTML=vStart();else if(screen==='who')v.innerHTML=vWho();
  else v.innerHTML=({pubs:vPubs,board:vBoard,photos:vPhotos,live:vLive,rules:vRules})[tab]();
  if(showMap)drawMap();
  if(!main&&sheet&&sheet!=='ask'){sheet=null;$('#ovl').innerHTML=''}
  if(main){if(sheet==='me')$('#ovl').innerHTML=vSheet();else if(sheet==='pen')$('#ovl').innerHTML=vPen();else if(sheet&&sheet.startsWith('view:'))$('#ovl').innerHTML=vViewer(sheet.slice(5))||'';}
}
document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(needRender&&!(a&&(a.tagName==='INPUT'||a.tagName==='SELECT')))render()},0));
const closeOv=()=>{sheet=null;$('#ovl').innerHTML='';if(needRender)render()};

/* ---------- map ---------- */
let map=null,layer=null;
function drawMap(){
  if(!window.L){$('#map').innerHTML='<p class="empty" style="padding:16px">The map needs an internet connection.</p>';return}
  if(!map){map=L.map('map',{zoomControl:false});
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
    map.fitBounds(H.map(h=>[h.b.lat,h.b.lng]),{padding:[24,24]});layer=L.layerGroup().addTo(map)}
  setTimeout(()=>map.invalidateSize(),60);
  layer.clearLayers();
  const pts=H.map((h,i)=>bar(i));
  const OFF={2:[-24,6],5:[22,0],6:[-20,-16]};
  pts.forEach((b,i)=>{const o=OFF[i]||[0,0];return L.marker([b.lat,b.lng],{icon:L.divIcon({className:'',html:`<div class="pin">${i+1}</div>`,iconSize:[30,30],iconAnchor:[15-o[0],15-o[1]]})}).bindPopup(`<b>${i+1}. ${esc(b.name)}</b><br>${esc(H[i].drink)}, par ${H[i].par}`).addTo(layer)});
  const byHole={};S.teams.forEach(t=>{const l=locOf(t);if(l!=null)(byHole[l]=byHole[l]||[]).push([t,0]);else{const {last}=lastDone(t);if(last>=0)(byHole[last]=byHole[last]||[]).push([t,1])}});
  Object.entries(byHole).forEach(([i,ts])=>{const b=pts[i];ts.forEach(([t,left],k)=>L.marker([b.lat,b.lng],{icon:L.divIcon({className:'',html:`<span class="tpin${left?' left':''}" style="background:${col(t)}">${esc(t.name)}${left?' (left)':''}</span>`,iconSize:null,iconAnchor:[-18,10-k*22]}),zIndexOffset:500}).addTo(layer))});
  const fresh=Date.now()-20*60e3;let live=0;
  S.players.forEach(p=>{const l=p.loc;if(!l||!(+l.t>fresh)||!isFinite(+l.lat))return;live++;const t=S.teams.find(x=>x.id===p.team_id);
    L.circleMarker([+l.lat,+l.lng],{radius:8,color:'#fff',weight:2,fillColor:col(t),fillOpacity:1}).bindTooltip(`${esc(p.name)}, ${tm(+l.t)}`,{permanent:true,direction:'top',offset:[0,-8]}).addTo(layer)});
  const sharing=ls.get('bg-loc')==='1';
  $('#mapbar').innerHTML=`<span>${live?`${live} live location${live>1?'s':''}. `:''}Team labels show the pub each team is at.</span><button class="btn ${sharing?'ghost':''}" data-act="loc">${sharing?'Stop sharing':'Share my location'}</button>`;
}
let watch=null,lastLoc=null;
function setSharing(on){ls.set('bg-loc',on?'1':null);
  if(watch!=null){navigator.geolocation.clearWatch(watch);watch=null}
  const m=me();
  if(!on){if(m)save(()=>sb.from('players').update({loc:null}).eq('id',m.id));render();return}
  if(!navigator.geolocation){toast('This phone does not offer location.');ls.set('bg-loc',null);return}
  watch=navigator.geolocation.watchPosition(pos=>{const m=me();if(!m)return;const {latitude:lat,longitude:lng}=pos.coords,now=Date.now();
    if(lastLoc&&now-lastLoc.t<40000&&Math.hypot((lat-lastLoc.lat)*111e3,(lng-lastLoc.lng)*92e3)<30)return;
    lastLoc={lat,lng,t:now};m.loc=lastLoc;save(()=>sb.from('players').update({loc:lastLoc}).eq('id',m.id),'Location not shared');if(tab==='live')render()},
    ()=>{toast('Location is blocked. Allow it in Settings, Privacy, Location Services.');ls.set('bg-loc',null);render()},{enableHighAccuracy:true,maximumAge:20000});
  render();
}

/* ---------- actions ---------- */
let photoHole=0,avatarMode=false;
function openGame(c){code=String(c).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);if(!code)return;ls.set('bg-last',code);
  try{history.replaceState(null,'','?g='+code)}catch(e){}
  S.loaded=false;S.game=null;S.teams=[];S.players=[];S.posts=[];selHole=null;render();load();subscribe();if(ls.get('bg-loc')==='1')setTimeout(()=>setSharing(true),1500)}
document.addEventListener('click',async e=>{
  const nb=e.target.closest('nav button');if(nb){tab=nb.dataset.tab;ls.set('bg-tab',tab);render();scrollTo(0,0);return}
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,i=+el.dataset.i;
  if(a==='closeov'){if(e.target!==el)return;closeOv();return}
  if(a==='dno'){askFn=null;closeOv();return}
  if(a==='dyes'){const f=askFn;askFn=null;closeOv();f&&f();return}
  if(a==='open')return openGame(el.dataset.code);
  if(a==='claim'){ls.set('bg-me-'+code,el.dataset.p);render();return}
  if(a==='leave'){ask('Leave this game on this phone? Your scores stay saved.',()=>{if(watch!=null)navigator.geolocation.clearWatch(watch);watch=null;if(chan)sb.removeChannel(chan);chan=null;code=null;recent=null;try{history.replaceState(null,'',location.pathname)}catch(e){}ls.set('bg-last',null);render()});return}
  if(a==='switch'){ls.set('bg-me-'+code,null);closeOv();render();return}
  if(a==='sheet'){sheet='me';render();return}
  if(a==='invite'){const u=shareUrl();try{if(navigator.share){await navigator.share({title:S.game?S.game.name:'Pub Golf',text:'Join our Pub Golf game',url:u});return}}catch(err){return}
    try{await navigator.clipboard.writeText(u);toast('Link copied. Send it to the group.')}catch(err){toast(u)}return}
  const t=myTeam();
  if(a==='pick'){selHole=i;render();return}
  if(a==='step'){const p=S.players.find(x=>x.id===el.dataset.p);if(!p)return;const v=scoresOf(p)[i],d=+el.dataset.d;
    if(v==null){if(d<0)return;setScore(p,i,1)}else if(v+d<1)setScore(p,i,null);else setScore(p,i,v+d);return}
  if(a==='here'&&t){selHole=i;t.here={h:i,t:Date.now()};render();
    save(()=>sb.from('teams').update({here:t.here}).eq('id',t.id),'Check in not saved');post({team_id:t.id,player_id:meId(),kind:'here',hole:i});return}
  if(a==='done'&&t){if(doneOf(t)[i]){setDone(t,i,false);return}
    const sips=members(t.id).reduce((s,p)=>s+(+scoresOf(p)[i]||0),0);
    if(!sips){ask('Nobody has a score at this pub yet. Mark it as done anyway?',async()=>{await setDone(t,i,true);post({team_id:t.id,player_id:meId(),kind:'done',hole:i,sips:0});selHole=null;render();scrollTo(0,0)});return}
    await setDone(t,i,true);post({team_id:t.id,player_id:meId(),kind:'done',hole:i,sips});selHole=null;render();scrollTo({top:0,behavior:'smooth'});toast('Nice! Pick your next pub.');return}
  if(a==='h5'){const v=el.dataset.v;if(S.game.h5!==v){S.game.h5=v;render();save(()=>sb.from('games').update({h5:v}).eq('id',code))}return}
  if(a==='pen'){penHole=i;penPid=null;sheet='pen';render();return}
  if(a==='penp'){penPid=el.dataset.p;render();return}
  if(a==='penadd'){const x=PENMAP[el.dataset.k],p=S.players.find(y=>y.id===penPid);if(!x||!p)return;
    post({team_id:p.team_id,player_id:p.id,kind:'pen:'+x[0],hole:penHole,sips:x[2]});toast(`${p.name} +${x[2]}: ${x[1]}`);return}
  if(a==='penrm'){const id=el.dataset.id;S.posts=S.posts.filter(o=>o.id!==id);render();save(()=>sb.from('posts').delete().eq('id',id));return}
  if(a==='sct'){scTeam=el.dataset.t;render();return}
  if(a==='view'){sheet='view:'+el.dataset.id;render();return}
  if(a==='delphoto'){const id=el.dataset.id;ask('Delete this photo for everyone?',()=>{S.posts=S.posts.filter(o=>o.id!==id);render();save(()=>sb.from('posts').delete().eq('id',id))});return}
  if(a==='photo'){photoHole=i;avatarMode=false;$('#file').click();return}
  if(a==='avatar'){avatarMode=true;$('#file').click();return}
  if(a==='rm'){const p=S.players.find(x=>x.id===el.dataset.p);if(p)ask(`Remove ${p.name} from the team?`,()=>{S.players=S.players.filter(x=>x.id!==p.id);render();save(()=>sb.from('players').delete().eq('id',p.id))});return}
  if(a==='loc'){setSharing(ls.get('bg-loc')!=='1');return}
});
document.addEventListener('change',e=>{if(e.target.id==='locSw')setSharing(e.target.checked);if(e.target.id==='phHole')phHole=+e.target.value});
$('#file').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';const m=me(),t=myTeam();if(!f||!m)return;
  toast('Uploading photo…');
  try{if(avatarMode){const url=await upload(f,320);m.avatar=url;render();await save(()=>sb.from('players').update({avatar:url}).eq('id',m.id));toast('Profile photo saved.')}
    else{const url=await upload(f,1400);await post({team_id:t&&t.id,player_id:m.id,kind:'photo',hole:photoHole,photo:url});toast('Photo posted.')}}
  catch(err){console.error(err);toast('Photo not uploaded: '+em(err))}});
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target,val=s=>((f.querySelector(s)||{}).value||'').trim();
  if(f.id==='fPhoto'){photoHole=+$('#phHole').value;phHole=photoHole;avatarMode=false;$('#file').click();return}
  if(f.id==='fNew'){const name=val('#gName');if(!name)return;const c=Array.from({length:5},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*31|0]).join('');
    try{await q(sb.from('games').insert({id:c,name,h5:'yt'}));f.querySelector('input').blur();openGame(c);toast('Game created. Tap Invite to share it.')}catch(err){console.error(err);toast('Could not create the game: '+em(err))}return}
  if(f.id==='fJoin'){f.querySelector('input').blur();openGame(val('#gCode'));return}
  if(f.id==='fTeam'){const tn=val('#tName'),pn=val('#tMe');if(!tn||!pn)return;const tid=uid(),pid=uid();
    const used=S.teams.map(t=>+t.color);let c=0;while(used.includes(c)&&c<COLORS.length-1)c++;
    try{await q(sb.from('teams').insert({id:tid,game_id:code,name:tn,color:c,done:{}}));await q(sb.from('players').insert({id:pid,game_id:code,team_id:tid,name:pn,scores:{}}));
      ls.set('bg-me-'+code,pid);f.reset();document.activeElement&&document.activeElement.blur();await load()}catch(err){console.error(err);toast('Could not create the team: '+em(err))}return}
  if(f.dataset.form==='addme'){const pn=f.querySelector('input').value.trim();if(!pn)return;const pid=uid();
    try{await q(sb.from('players').insert({id:pid,game_id:code,team_id:f.dataset.t,name:pn,scores:{}}));ls.set('bg-me-'+code,pid);f.reset();document.activeElement&&document.activeElement.blur();await load()}catch(err){toast('Could not join the team: '+em(err))}return}
  const m=me(),t=myTeam();if(!m||!t)return;
  if(f.id==='fName'){const n=val('#meName');f.querySelector('input').blur();if(n&&n!==m.name){m.name=n;render();save(()=>sb.from('players').update({name:n}).eq('id',m.id));toast('Name saved.')}return}
  if(f.id==='fTName'){const n=val('#teamName');f.querySelector('input').blur();if(n&&n!==t.name){t.name=n;render();save(()=>sb.from('teams').update({name:n}).eq('id',t.id));toast('Team renamed.')}return}
  if(f.id==='fMate'){const n=val('#mate');if(!n)return;const row={id:uid(),game_id:code,team_id:t.id,name:n,scores:{}};
    S.players.push({...row,created_at:new Date().toISOString()});f.querySelector('input').value='';f.querySelector('input').blur();render();save(()=>sb.from('players').insert(row),'Teammate not added')}
});

/* ---------- start ---------- */
if(configured&&window.supabase){sb=window.supabase.createClient(CFG.url,CFG.key);
  const c=new URLSearchParams(location.search).get('g')||ls.get('bg-last');if(c)openGame(c);else render()}
else render();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&code){load();flushAll()}});
addEventListener('online',()=>{setNet(true);if(code){load();flushAll()}});
addEventListener('offline',()=>setNet(false));
// safety net in case live updates drop (bad signal in bars): refresh every 15 s while open
setInterval(()=>{if(code&&document.visibilityState==='visible')load()},15000);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body></html>
